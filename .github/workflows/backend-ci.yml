name: ShareBill CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir fe check
      - run: pnpm --dir fe build
      - run: pnpm --dir be build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm --dir fe exec playwright install --with-deps chromium
      - run: pnpm --dir be exec firebase emulators:exec --project demo-sharebill --only auth,firestore "bash ../fe/test/run-ci.sh"
        env:
          FIREBASE_PROJECT_ID: demo-sharebill
          FIREBASE_WEB_API_KEY: demo
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          SHAREBILL_PWA_TEST: '1'

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:be
      - run: pnpm test:be
      - run: pnpm --dir be build
      - run: pnpm --dir be exec firebase emulators:exec --project demo-sharebill --only auth,firestore,storage "pnpm test:emulator"
        env:
          FIREBASE_PROJECT_ID: demo-sharebill
          FIREBASE_WEB_API_KEY: demo
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          FIREBASE_STORAGE_BUCKET: demo-sharebill.appspot.com
