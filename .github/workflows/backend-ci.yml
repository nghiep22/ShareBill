name: ShareBill CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      NEXT_PUBLIC_APP_ENVIRONMENT: local
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-sharebill
      NEXT_PUBLIC_SHAREBILL_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir fe check
      - run: pnpm --dir fe build
      - run: pnpm --dir be build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm --dir fe exec playwright install --with-deps chromium
      - run: pnpm --dir be exec firebase emulators:exec --project demo-sharebill --only auth,firestore "bash ../fe/test/run-ci.sh"
        env:
          FIREBASE_PROJECT_ID: demo-sharebill
          FIREBASE_WEB_API_KEY: demo
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          SHAREBILL_PWA_TEST: '1'
          SHAREBILL_SMOKE_REPORT: /tmp/sharebill-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: staging-smoke-rehearsal
          path: /tmp/sharebill-smoke.json
          if-no-files-found: ignore
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:be
      - run: pnpm test:be
      - run: pnpm test:smoke
      - run: pnpm --dir be build
      - run: pnpm --dir be exec firebase emulators:exec --project demo-sharebill --only auth,firestore,storage "pnpm test:emulator"
        env:
          FIREBASE_PROJECT_ID: demo-sharebill
          FIREBASE_WEB_API_KEY: demo
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          FIREBASE_STORAGE_BUCKET: demo-sharebill.appspot.com

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir be backup:rehearse --report-file "$RUNNER_TEMP/restore-rehearsal.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: restore-rehearsal-summary
          path: ${{ runner.temp }}/restore-rehearsal.json
          if-no-files-found: error
          retention-days: 7
